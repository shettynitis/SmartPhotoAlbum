version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install -r LambdaFunction/LF1/requirements.txt -t LambdaFunction/LF1/
  build:
    commands:
      - echo "Packaging Lambda function..."
      - cd LambdaFunction/LF1 && zip -r ../../LF1.zip . && cd ../../
      - echo "Fetching current Lambda function version..."
      - CURRENT_VERSION=$(aws lambda list-aliases --function-name index-photos --query 'Aliases[?Name==`live`].FunctionVersion' --output text)
      - TARGET_VERSION=$((CURRENT_VERSION + 1))
      - echo "Current Version: $CURRENT_VERSION, Target Version: $TARGET_VERSION"
      - echo "Generating AppSpec file..."
      - echo "version: 0.0
        Resources:
          - myLambdaFunction:
              Type: AWS::Lambda::Function
              Properties:
                Name: index-photos
                Alias: live
                CurrentVersion: $CURRENT_VERSION
                TargetVersion: $TARGET_VERSION" > appspec.yml
      - echo "Build completed. Verifying files..."
      - ls -la
artifacts:
  files:
    - LF1.zip
    - appspec.yml
  discard-paths: yes

