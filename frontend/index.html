<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Search and Upload</title>
  <script src="app.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #results {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    #results div {
      text-align: center;
    }

    #results img {
      max-width: 200px;
      margin: 10px;
    }

    .form-section {
      margin-bottom: 20px;
    }
  </style>
  <!-- api gateway generated sdk -->
  <script src="./sdk/lib/axios/dist/axios.standalone.js"></script>
  <script src="./sdk/lib/CryptoJS/rollups/hmac-sha256.js"></script>
  <script src="./sdk/lib/CryptoJS/rollups/sha256.js"></script>
  <script src="./sdk/lib/CryptoJS/components/hmac.js"></script>
  <script src="./sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script src="./sdk/lib/url-template/url-template.js"></script>
  <script src="./sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="./sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="./sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="./sdk/lib/apiGatewayCore/utils.js"></script>


  <script src="./sdk/apigClient.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" defer></script>
  <style>
    img {
      object-fit: cover;
      height: 200px;
      width: 100%;
    }
  </style>
  <style>
    body {
      background-color: #fffaf0; /* Light beige color */
      color: #333; /* Optional: Ensures text contrast */
      font-family: Arial, sans-serif; /* Optional: Sets a clean font */
    }
  </style>
  
</head>

<body>
  <div class="container mt-5">

    <!-- Search Section -->
    <div class="form-section mb-5">
      <h1 class="text-center mb-4">Photo Search and Upload</h1>
      <div class="input-group mb-3">
        <input type="text" id="searchQuery" class="form-control" placeholder="Search for photos..." />
        <button class="btn btn-primary" onclick="searchPhotos()">Search</button>
      </div>
    </div>


    <!-- Upload Section -->
    <div class="form-section mb-5">
      <h2 class="mb-3">Upload Photo</h2>
      <form id="uploadForm" class="row g-3">
        <div class="col-md-6">
          <input type="file" id="photo" class="form-control" accept="image/*" required />
        </div>
        <div class="col-md-6">
          <input type="text" id="customLabels" class="form-control" placeholder="Custom Labels (comma-separated)" />
        </div>
        <div class="col-md-12 text-end">
          <button type="button" class="btn btn-success" onclick="uploadPhoto()">Upload</button>
        </div>
      </form>
    </div>


    <!-- Results Section -->
    <h2 class="mt-5">Search Results</h2>
    <div id="results" class="d-flex flex-wrap gap-3"></div>
  </div>
</body>

</html>
